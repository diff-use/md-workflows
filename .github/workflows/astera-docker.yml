name: Astera ACTL Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.astera
      - .github/workflows/astera-docker.yml
  workflow_dispatch:

env:
  ASTERA_REGISTRY: harbor.astera.sh
  ASTERA_IMAGE_NAME: library/md-workflows
  ACTL_VERSION_TAG: 0.0.2-actl-2026-06-09
  MD_WORKFLOWS_BASE_IMAGE: ${{ vars.MD_WORKFLOWS_BASE_IMAGE || 'docker.io/diffuseproject/md:0.0.2@sha256:0ec5455d36f3d097fa67c73c3b7b86c0bd039ec19d5ca416ae5350d9476703e5' }}

jobs:
  astera:
    name: Build Astera ACTL image
    runs-on: astera-sh-builder
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ASTERA_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ASTERA_REGISTRY }}/${{ env.ASTERA_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ACTL_VERSION_TAG }}
            type=raw,value=0.0.2-actl
            type=raw,value=actl
            type=sha,prefix=sha-

      - name: Build and push Astera image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.astera
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MD_WORKFLOWS_BASE_IMAGE=${{ env.MD_WORKFLOWS_BASE_IMAGE }}
          cache-from: type=registry,ref=${{ env.ASTERA_REGISTRY }}/${{ env.ASTERA_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ASTERA_REGISTRY }}/${{ env.ASTERA_IMAGE_NAME }}:buildcache,mode=max
          provenance: false

      - name: Image digest
        run: echo "Astera md-workflows image pushed with digest ${{ steps.build.outputs.digest }}"
